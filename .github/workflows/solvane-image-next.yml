# Builds the Solvane chat image from THIS branch and pushes it to GHCR.
# Render pulls ghcr.io/abdulhaseeb262/librechat:solvane. Every push to the
# `solvane` branch is a new image; Render redeploys on the tag it tracks.
name: solvane-image
on:
  push:
    branches: [solvane-0.8]
  workflow_dispatch:
concurrency:
  group: solvane-image-next
  cancel-in-progress: true
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/abdulhaseeb262/librechat:solvane-next
            ghcr.io/abdulhaseeb262/librechat:solvane-next-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Tell Render to pull the new image. RENDER_DEPLOY_HOOK is the
      # solvane-chat service's Deploy Hook URL (Render -> service -> Settings),
      # stored as a repository secret. Skipped silently until it is set.
      # `secrets` is not allowed inside `if:` (it invalidates the whole workflow:
      # "No jobs were run"), so the check happens in the shell instead.
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "RENDER_DEPLOY_HOOK not set — skipping"; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Render deploy triggered"
